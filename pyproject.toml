[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmsim"
version = "0.1.0"
description = "Market making under inventory risk: Avellaneda-Stoikov, exact solution, simulation and stress tests"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Moksh Shah" }]
dependencies = ["numpy>=2.0", "scipy>=1.11", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
